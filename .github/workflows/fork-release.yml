name: Fork release

# Fork-only release pipeline.
#
# Every push to main is released as <upstream-tag>-fork.<n> (e.g. v1.25.3-fork.4),
# where <upstream-tag> is the newest upstream release contained in main. The built
# management.html is attached to a matching GitHub release, and the git tag is
# created alongside it so tag-based deploy pipelines pick up the change.
#
# Kept as a separate file (like the backend's ghcr-publish.yml) so syncing from
# upstream never conflicts with upstream's own release.yml.
#
# Tags created with GITHUB_TOKEN do not trigger other workflows, so upstream's
# release.yml (on: push tags) stays idle for these tags.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fork-release
  # Queue instead of cancelling so a run never stops between build and tagging.
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail
          # Upstream tags are namespaced so they never mix with the fork's own tags.
          git fetch --quiet --no-tags https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git \
            '+refs/tags/v*:refs/tags/upstream/v*' || true
          base="$(git describe --tags --abbrev=0 --match 'upstream/v*' HEAD 2>/dev/null || echo upstream/v0.0.0)"
          base="${base#upstream/}"

          # Re-runs on an already released commit reuse its version.
          existing="$(git tag --points-at HEAD --list 'v*-fork.*' | sort -V | tail -n 1 || true)"
          if [[ -n "$existing" ]]; then
            version="$existing"
          else
            last_n="$(git tag --list "${base}-fork.*" | sed "s/^${base}-fork\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
            version="${base}-fork.$(( ${last_n:-0} + 1 ))"
          fi
          previous="$(git tag --list 'v*-fork.*' --sort=-v:refname | grep -vx "$version" | head -n 1 || true)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (previous: ${previous:-none})"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all-in-one HTML
        run: bun run build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Tag and create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          {
            printf '## Changelog\n\n'
            if [[ -n "$PREVIOUS" ]]; then
              git log --reverse --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS}..HEAD"
            else
              git log -1 --pretty=format:'- %s (%h)' HEAD
            fi
            printf '\n'
          } > "$notes_file"

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$notes_file" \
            dist/management.html
